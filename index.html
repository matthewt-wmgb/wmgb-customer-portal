<!DOCTYPE html>

    <style>

            font-family: Arial, sans-serif;
            max-width: 1400px;

        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }

        .btn {
            display: inline-block;
            background: #005a9c;
            color: white;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .btn:hover {
            background: #00457a;
        }

        .pdf-frame {
            width: 100%;
            height: 900px;
            border: 1px solid #ddd;
        }

        .form-frame {
            width: 100%;
            height: 1400px;
            border: none;
        }

        h1 {
            color: #005a9c;
        }

</head>

<body>

    <div class="card">

</div>
